<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLAXXI AI - Admin Dashboard</title>
    <style>
        :root {
            --bg-dark: #0a0507;
            --card-bg: #130c11;
            --accent-red: #ff2a55;
            --text-main: #ffffff;
            --text-sub: #a399a2;
            --border-color: #261822;
            --green: #2ecc71;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 20px 15px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 20px;
            color: var(--accent-red);
            font-weight: 800;
        }

        .btn-logout {
            background: #20141c;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            width: 100%;
        }

        .card-title {
            color: var(--accent-red);
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        /* --- Table Overflow Fix --- */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 13px;
            min-width: 480px; /* Ensures structure doesn't break on small screens */
        }

        th {
            color: var(--text-sub);
            padding: 12px 10px;
            font-weight: 600;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }

        td {
            padding: 14px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            white-space: nowrap;
        }

        .plan-starter { color: var(--accent-red); font-weight: 600; }
        .plan-unlimited { color: var(--accent-red); font-weight: 700; }
        .status-active { color: var(--green); font-weight: 600; }

        /* Input Controls */
        label { display: block; color: var(--text-sub); font-size: 11px; margin-bottom: 6px; text-transform: uppercase; }
        select, input {
            width: 100%;
            padding: 12px;
            background: #0a0507;
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 8px;
            margin-bottom: 12px;
            outline: none;
        }

        .btn-red {
            width: 100%;
            background: var(--accent-red);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>FLAXXI AI - Admin Dashboard</h1>
        <button class="btn-logout">Logout</button>
    </div>

    <!-- Key Manager Card -->
    <div class="card">
        <div class="card-title">Key Manager</div>
        <label>Select Plan</label>
        <select>
            <option>Lifetime Access</option>
            <option>Unlimited Plan</option>
            <option>Starter Plan</option>
        </select>
        <button class="btn-red">Auto Generate Key</button>
        
        <div style="text-align: center; color: var(--text-sub); font-size: 11px; margin: 10px 0;">— OR ADD CUSTOM KEY —</div>
        
        <input type="text" value="FLAXXI">
        <button class="btn-logout" style="width:100%;">Add Custom Key</button>
    </div>

    <!-- Plan Price Manager Card -->
    <div class="card">
        <div class="card-title">Plan Price Manager</div>
        <label>Select Plan to Edit</label>
        <select>
            <option>Lifetime Plan</option>
        </select>
        <label>Set New Price</label>
        <input type="text" value="69.99 € once">
        <button class="btn-red">Update Plan Price</button>
    </div>

    <!-- User Accounts & Time Manager (Fixed Overflow) -->
    <div class="card">
        <div class="card-title">User Accounts & Time Manager</div>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>User Email / Phone</th>
                        <th>Login Type</th>
                        <th>Plan</th>
                        <th>Time Remaining</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>user_9819833267</td>
                        <td>Phone OTP</td>
                        <td class="plan-unlimited">Unlimited</td>
                        <td>28 Days 14 Hours</td>
                        <td class="status-active">Active</td>
                    </tr>
                    <tr>
                        <td>flaxxi.user@gmail.com</td>
                        <td>Google</td>
                        <td class="plan-starter">Starter</td>
                        <td>12 Days 02 Hours</td>
                        <td class="status-active">Active</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
