<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLAXXI AI - Admin Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: radial-gradient(circle at top, #2d0b13 0%, #08070a 70%); color: #fff; min-height: 100vh; padding: 20px; display: flex; justify-content: center; align-items: center; }
        .admin-card { background: #0f0e13; border: 1px solid #251217; border-radius: 20px; padding: 25px; width: 100%; max-width: 480px; box-shadow: 0 10px 40px rgba(255, 42, 75, 0.15); }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h2 { color: #ff2a4b; font-size: 1.4rem; font-weight: 800; }
        .nav-tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid #22202c; padding-bottom: 10px; }
        .tab-btn { background: #121118; border: 1px solid #251217; color: #aaa; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 600; flex: 1; }
        .tab-btn.active { background: #ff2a4b; border-color: #ff2a4b; color: #fff; }
        .input-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.75rem; color: #aaa; margin-bottom: 5px; text-transform: uppercase; font-weight: 600; }
        input, select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #22202c; background: #121118; color: white; outline: none; }
        input:focus, select:focus { border-color: #ff2a4b; }
        .btn-primary { width: 100%; padding: 12px; background: linear-gradient(90deg, #ff2a4b, #e0002b); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .list-box { margin-top: 15px; max-height: 250px; overflow-y: auto; }
        .item-card { background: #121118; border: 1px solid #251217; border-left: 3px solid #ff2a4b; padding: 12px; border-radius: 8px; margin-bottom: 8px; font-size: 0.85rem; display: flex; justify-content: space-between; align-items: center; }
        .del-btn { color: #ff2a4b; background: none; border: none; cursor: pointer; font-weight: bold; font-size: 1rem; }
    </style>
</head>
<body>

<div class="admin-card">
    <div class="header-bar">
        <h2>FLAXXI AI Dashboard</h2>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" id="tabKeysBtn" onclick="switchTab('keys')">Key Manager</button>
        <button class="tab-btn" id="tabUsersBtn" onclick="switchTab('users')">Registered Users</button>
    </div>

    <!-- Key Manager Section -->
    <div id="keysSection">
        <div class="input-group">
            <label>Select Plan</label>
            <select id="planType">
                <option value="starter">Starter Plan</option>
                <option value="unlimited">Unlimited Plan</option>
                <option value="lifetime">Lifetime Access</option>
            </select>
        </div>
        <button class="btn-primary" onclick="genKey()">Auto Generate Key</button>
        <div class="list-box" id="keyList"></div>
    </div>

    <!-- Users Section -->
    <div id="usersSection" style="display:none;">
        <label>User Accounts</label>
        <div class="list-box" id="userList"></div>
    </div>
</div>

<script>
    function switchTab(tab) {
        document.getElementById('keysSection').style.display = tab === 'keys' ? 'block' : 'none';
        document.getElementById('usersSection').style.display = tab === 'users' ? 'block' : 'none';
        document.getElementById('tabKeysBtn').classList.toggle('active', tab === 'keys');
        document.getElementById('tabUsersBtn').classList.toggle('active', tab === 'users');
        if(tab === 'users') loadUsers();
    }

    function genKey() {
        const plan = document.getElementById('planType').value;
        const key = `FLAXXI-${plan.toUpperCase()}-${Math.random().toString(36).substring(2,7).toUpperCase()}`;
        let keys = JSON.parse(localStorage.getItem('flaxxi_keys') || "[]");
        keys.push({ key, plan });
        localStorage.setItem('flaxxi_keys', JSON.stringify(keys));
        loadKeys();
    }

    function loadKeys() {
        let keys = JSON.parse(localStorage.getItem('flaxxi_keys') || "[]");
        document.getElementById('keyList').innerHTML = keys.map((k, i) => `
            <div class="item-card">
                <div><strong>${k.key}</strong><br><small style="color:#aaa;">Plan: ${k.plan.toUpperCase()}</small></div>
                <button class="del-btn" onclick="delKey(${i})">✕</button>
            </div>
        `).join('') || '<div style="color:#666; font-size:0.8rem; text-align:center;">No keys generated</div>';
    }

    function delKey(i) {
        let keys = JSON.parse(localStorage.getItem('flaxxi_keys') || "[]");
        keys.splice(i, 1);
        localStorage.setItem('flaxxi_keys', JSON.stringify(keys));
        loadKeys();
    }

    function loadUsers() {
        let users = JSON.parse(localStorage.getItem('flaxxi_users') || "[]");
        if(!users.length) {
            document.getElementById('userList').innerHTML = '<div style="color:#666; font-size:0.8rem; text-align:center; padding:10px;">No registered users yet.</div>';
            return;
        }
        document.getElementById('userList').innerHTML = users.map(u => `
            <div class="item-card">
                <div>
                    <strong>${u.name || u.contact}</strong><br>
                    <small style="color:#888;">Method: ${u.type} | Date: ${u.date}</small>
                </div>
            </div>
        `).join('');
    }

    loadKeys();
</script>
</body>
</html>
