<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLAXXI AI - Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0a0407;
            --card-bg: #140b10;
            --accent-red: #ff2a55;
            --accent-glow: rgba(255, 42, 85, 0.35);
            --text-main: #ffffff;
            --text-sub: #a399a2;
            --border-color: #2b1723;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px 15px;
            background-image: radial-gradient(circle at 50% 20%, rgba(255, 42, 85, 0.15) 0%, transparent 60%);
        }

        .container { max-width: 500px; margin: 0 auto; }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 900;
        }
        .header h1 span { color: var(--accent-red); }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
        }

        .card-title {
            font-size: 14px;
            font-weight: 800;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group {
            margin-bottom: 14px;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            color: var(--text-sub);
            margin-bottom: 6px;
            font-weight: 700;
        }

        .form-input, .form-select {
            width: 100%;
            background: #ffffff;
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 10px;
            color: #000;
            font-size: 14px;
            font-weight: 600;
            outline: none;
        }

        .btn-action {
            background: var(--accent-red);
            color: white;
            border: none;
            padding: 13px;
            border-radius: 10px;
            font-weight: 800;
            width: 100%;
            cursor: pointer;
            font-size: 14px;
            box-shadow: 0 0 12px var(--accent-glow);
            transition: all 0.2s ease;
        }

        .btn-action:active { transform: scale(0.98); }

        .key-display {
            background: #1c0e17;
            border: 1px dashed var(--accent-red);
            padding: 12px;
            border-radius: 10px;
            margin-top: 14px;
            text-align: center;
            font-size: 13px;
            font-weight: 800;
            color: var(--accent-red);
            word-break: break-all;
            display: none;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 800;
            margin-top: 6px;
        }
        .status-paid { background: rgba(255, 42, 85, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }
        .status-free { background: rgba(37, 211, 102, 0.2); color: #25d366; border: 1px solid #25d366; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>FLAXXI <span>AI ADMIN</span></h1>
            <p style="font-size: 12px; color: var(--text-sub);">System Control & Access Key Management</p>
        </div>

        <!-- 1. AI API CONFIGURATION -->
        <div class="card">
            <div class="card-title"><i class="fa-solid fa-robot" style="color:var(--accent-red);"></i> AI Configurations</div>
            
            <div class="input-group">
                <label>Google Gemini API Key</label>
                <input type="text" id="geminiKey" class="form-input" placeholder="AIzaSy...">
            </div>

            <div class="input-group">
                <label>ChatGPT (OpenAI) API Key</label>
                <input type="text" id="openaiKey" class="form-input" placeholder="sk-...">
            </div>

            <div class="input-group">
                <label>Claude AI (Anthropic) API Key</label>
                <input type="text" id="claudeKey" class="form-input" placeholder="sk-ant-...">
            </div>

            <div class="input-group">
                <label>Dark GPT API Key / Endpoint URL</label>
                <input type="text" id="darkGptKey" class="form-input" placeholder="Dark GPT API Key or Endpoint">
            </div>

            <button class="btn-action" onclick="saveAiKeys()">Save AI Configurations</button>
        </div>

        <!-- 2. WEBSITE MODE CONTROL (FREE / PAID) -->
        <div class="card">
            <div class="card-title"><i class="fa-solid fa-globe" style="color:var(--accent-red);"></i> Website Access Mode</div>
            
            <div class="input-group">
                <label>Website Access Status</label>
                <select id="websiteMode" class="form-select">
                    <option value="PAID">PAID MODE (Daily Free Limit + Subscription Plan Needed)</option>
                    <option value="FREE">100% FREE MODE (No Message Limits for Anyone)</option>
                    <option value="MAINTENANCE">MAINTENANCE MODE (Site Locked)</option>
                </select>
            </div>

            <button class="btn-action" onclick="saveWebsiteMode()">Save Website Status</button>
        </div>

        <!-- 3. DAILY QUESTION LIMIT SETTINGS -->
        <div class="card">
            <div class="card-title"><i class="fa-solid fa-sliders" style="color:var(--accent-red);"></i> Daily Question Limit Settings</div>
            
            <div class="input-group">
                <label>Free User Daily Questions Limit</label>
                <input type="number" id="dailyLimit" class="form-input" value="7">
            </div>

            <button class="btn-action" onclick="saveLimit()">Save Question Limit</button>
        </div>

        <!-- 4. GENERATE ACCESS KEY WITH DEVICE CONTROL -->
        <div class="card">
            <div class="card-title"><i class="fa-solid fa-ticket" style="color:var(--accent-red);"></i> Generate Access Key</div>
            
            <div class="input-group">
                <label>Select Plan Validity</label>
                <select id="planValidity" class="form-select">
                    <option value="1DAY">1 Day Pass (24 Hours)</option>
                    <option value="7DAYS">7 Days Pass</option>
                    <option value="1MONTH">1 Month Pass</option>
                    <option value="1YEAR">1 Year Pass</option>
                    <option value="LIFETIME">Lifetime VIP Pass</option>
                </select>
            </div>

            <div class="input-group">
                <label>Allowed Devices Limit (Key Login Limit)</label>
                <select id="deviceLimit" class="form-select">
                    <option value="1">1 Device</option>
                    <option value="2">2 Devices</option>
                    <option value="3">3 Devices</option>
                    <option value="7">7 Devices</option>
                    <option value="UNLIMITED">Unlimited Devices</option>
                </select>
            </div>

            <button class="btn-action" onclick="generateKey()">Generate Key</button>

            <div class="key-display" id="keyDisplayBox" onclick="copyGeneratedKey()">
                <div style="font-size: 10px; color: var(--text-sub); margin-bottom: 4px;">CLICK TO COPY KEY</div>
                <span id="keyText">FLAXXI-1MONTH-DEV1-XXXXXX</span>
            </div>
        </div>
    </div>

    <script>
        // Load existing settings on page load
        window.onload = function() {
            if (localStorage.getItem('flaxxi_gemini_key')) document.getElementById('geminiKey').value = localStorage.getItem('flaxxi_gemini_key');
            if (localStorage.getItem('flaxxi_openai_key')) document.getElementById('openaiKey').value = localStorage.getItem('flaxxi_openai_key');
            if (localStorage.getItem('flaxxi_claude_key')) document.getElementById('claudeKey').value = localStorage.getItem('flaxxi_claude_key');
            if (localStorage.getItem('flaxxi_darkgpt_key')) document.getElementById('darkGptKey').value = localStorage.getItem('flaxxi_darkgpt_key');

            if (localStorage.getItem('flaxxi_website_mode')) {
                document.getElementById('websiteMode').value = localStorage.getItem('flaxxi_website_mode');
            }

            if (localStorage.getItem('flaxxi_daily_limit')) {
                document.getElementById('dailyLimit').value = localStorage.getItem('flaxxi_daily_limit');
            }
        };

        function saveAiKeys() {
            localStorage.setItem('flaxxi_gemini_key', document.getElementById('geminiKey').value.trim());
            localStorage.setItem('flaxxi_openai_key', document.getElementById('openaiKey').value.trim());
            localStorage.setItem('flaxxi_claude_key', document.getElementById('claudeKey').value.trim());
            localStorage.setItem('flaxxi_darkgpt_key', document.getElementById('darkGptKey').value.trim());
            alert('AI Configurations Saved Successfully!');
        }

        function saveWebsiteMode() {
            const mode = document.getElementById('websiteMode').value;
            localStorage.setItem('flaxxi_website_mode', mode);
            alert('Website Mode updated to: ' + mode);
        }

        function saveLimit() {
            const limit = document.getElementById('dailyLimit').value;
            if(!limit || limit < 0) { alert('Valid limit numeric dalein!'); return; }
            localStorage.setItem('flaxxi_daily_limit', limit);
            alert('Daily Question Limit updated to ' + limit);
        }

        function generateKey() {
            const validity = document.getElementById('planValidity').value;
            const deviceLimit = document.getElementById('deviceLimit').value;
            const randomCode = Math.random().toString(36).substring(2, 8).toUpperCase();

            // Format: FLAXXI-[PLAN]-[DEVICES]-[RANDOM]
            const generatedKey = `FLAXXI-${validity}-DEV${deviceLimit}-${randomCode}`;

            let activeKeys = JSON.parse(localStorage.getItem('flaxxi_active_keys')) || [];
            
            // Key Data storing with device allowance details
            const keyData = {
                key: generatedKey,
                validity: validity,
                allowedDevices: deviceLimit,
                usedDevicesCount: 0
            };

            activeKeys.push(generatedKey);
            localStorage.setItem('flaxxi_active_keys', JSON.stringify(activeKeys));
            localStorage.setItem('flaxxi_key_details_' + generatedKey, JSON.stringify(keyData));

            document.getElementById('keyText').innerText = generatedKey;
            document.getElementById('keyDisplayBox').style.display = 'block';
        }

        function copyGeneratedKey() {
            const keyText = document.getElementById('keyText').innerText;
            navigator.clipboard.writeText(keyText);
            alert('Access Key Copied to Clipboard!');
        }
    </script>
</body>
</html>
