<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLAXXI ADMIN - Control Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0a0407;
            --card-bg: #140b10;
            --accent-red: #ff2a55;
            --accent-glow: rgba(255, 42, 85, 0.35);
            --text-main: #ffffff;
            --text-sub: #a399a2;
            --border-color: #2b1723;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            background-image: radial-gradient(circle at 50% 30%, rgba(255, 42, 85, 0.15) 0%, transparent 60%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Admin Card Container */
        .admin-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 35px 25px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            text-align: center;
        }

        .admin-title {
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 4px;
        }

        .admin-title span { color: var(--accent-red); }

        .admin-subtitle {
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 25px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 6px;
            font-weight: 600;
        }

        .form-input {
            width: 100%;
            background: #ffffff;
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 10px;
            color: #000000;
            outline: none;
            font-size: 14px;
            font-weight: 600;
        }

        .btn-signin {
            background: var(--accent-red);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .error-msg {
            color: #ff4d4d;
            font-size: 12px;
            margin-top: 15px;
            display: none;
            font-weight: 600;
        }

        /* Dashboard Screen */
        .dashboard {
            display: none;
            width: 100%;
            max-width: 500px;
        }

        .dash-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .dash-card h3 {
            font-size: 16px;
            color: var(--accent-red);
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .key-box {
            background: #0d060a;
            border: 1px dashed var(--border-color);
            padding: 12px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 13px;
            margin-top: 12px;
            word-break: break-all;
            color: #25d366;
        }
    </style>
</head>
<body>

    <!-- Admin Login Form -->
    <div class="admin-card" id="loginCard">
        <div class="admin-title">FLAXXI <span>ADMIN</span></div>
        <div class="admin-subtitle">Control Panel Management</div>

        <div class="input-group">
            <label>Admin Username</label>
            <input type="text" id="adminUser" class="form-input" placeholder="Enter username">
        </div>

        <div class="input-group">
            <label>Admin Password</label>
            <input type="password" id="adminPass" class="form-input" placeholder="Enter password">
        </div>

        <button class="btn-signin" onclick="handleLogin()">Sign In</button>

        <div class="error-msg" id="loginError">Invalid credentials! Try again.</div>
    </div>

    <!-- Admin Panel Dashboard -->
    <div class="dashboard" id="dashboard">
        <div class="dash-card">
            <h3>Admin Management Dashboard</h3>
            <p style="font-size: 13px; color: var(--text-sub);">Welcome, Tenzino! Generate new access keys for Pro users below.</p>
            
            <button class="btn-signin" onclick="generateNewKey()">Generate New Pro Key</button>
            <div class="key-box" id="keyOutput">Click button to generate key...</div>
        </div>
    </div>

    <script>
        // Updated Credentials
        const ADMIN_USERNAME = "Tenzino";
        const ADMIN_PASSWORD = "Tenzino@766";

        function handleLogin() {
            const userIn = document.getElementById('adminUser').value.trim();
            const passIn = document.getElementById('adminPass').value.trim();
            const errorElement = document.getElementById('loginError');

            if (userIn === ADMIN_USERNAME && passIn === ADMIN_PASSWORD) {
                document.getElementById('loginCard').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
            } else {
                errorElement.style.display = 'block';
            }
        }

        function generateNewKey() {
            const randomKey = "FLAXXI-" + Math.random().toString(36).substring(2, 8).toUpperCase() + "-2026";
            document.getElementById('keyOutput').innerText = "Generated Key: " + randomKey;
        }

        // Enter key shortcut for login
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                handleLogin();
            }
        });
    </script>
</body>
</html>
