<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLAXXI AI - Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0a0507;
            --card-bg: #130c11;
            --accent-red: #ff2a55;
            --text-main: #ffffff;
            --text-sub: #a399a2;
            --border-color: #261822;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: var(--bg-dark); color: white; padding: 20px 15px; }

        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 18px; margin-bottom: 20px; }
        .card-title { color: var(--accent-red); font-size: 16px; font-weight: bold; margin-bottom: 12px; }

        input, select { width: 100%; padding: 10px; background: #080306; border: 1px solid var(--border-color); color: white; border-radius: 8px; margin-bottom: 10px; outline: none; }
        
        .btn-red { background: var(--accent-red); color: white; border: none; padding: 10px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; }
        .btn-logout { background: #20141c; color: white; border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 6px; cursor: pointer; float: right; }

        .key-display { background: #000; padding: 10px; border: 1px dashed var(--accent-red); border-radius: 6px; color: #2ecc71; margin-top: 10px; font-family: monospace; display: none; word-break: break-all; }
    </style>
</head>
<body>

    <div style="margin-bottom: 20px; overflow: hidden;">
        <span style="font-size: 18px; font-weight: bold; color: var(--accent-red);">FLAXXI AI - Admin Dashboard</span>
        <button class="btn-logout" onclick="adminLogout()">Logout</button>
    </div>

    <!-- API Key Settings Card -->
    <div class="card">
        <div class="card-title">System API Key Config</div>
        <label style="font-size: 12px; color: var(--text-sub);">Custom OpenAI / LLM API Key</label>
        <input type="password" id="apiKeyInput" placeholder="sk-proj-xxxxxxxxxxxxxxxx">
        <button class="btn-red" onclick="saveApiKey()">Save System API Key</button>
    </div>

    <!-- Key Generator Card -->
    <div class="card">
        <div class="card-title">Key Manager</div>
        <label style="font-size: 12px; color: var(--text-sub);">SELECT PLAN</label>
        <select id="planSelect">
            <option value="Starter Plan">Starter Plan</option>
            <option value="Unlimited Plan">Unlimited Plan</option>
            <option value="Lifetime Access">Lifetime Access</option>
        </select>

        <button class="btn-red" onclick="generateNewKey()">Auto Generate Key</button>
        <div id="generatedKeyBox" class="key-display"></div>

        <div style="text-align: center; color: var(--text-sub); font-size: 11px; margin: 12px 0;">— OR ADD CUSTOM KEY —</div>

        <input type="text" id="customKey" placeholder="FLAXXI-CUSTOM-KEY">
        <button class="btn-red" style="background:#20141c;" onclick="addCustomKey()">Add Custom Key</button>
    </div>

    <script>
        // Save System API Key
        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if(key) {
                localStorage.setItem('system_api_key', key);
                alert("API Key saved successfully!");
            } else {
                alert("Please enter a valid API Key!");
            }
        }

        // Generate Key Function
        function generateNewKey() {
            const plan = document.getElementById('planSelect').value;
            const key = "FLAXXI-" + plan.substring(0,3).toUpperCase() + "-" + Math.random().toString(36).substring(2, 8).toUpperCase();
            
            const displayBox = document.getElementById('generatedKeyBox');
            displayBox.style.display = 'block';
            displayBox.innerText = `Generated Key (${plan}):\n${key}`;
        }

        function addCustomKey() {
            const custom = document.getElementById('customKey').value.trim();
            if(custom) {
                alert(`Custom Key '${custom}' registered successfully!`);
                document.getElementById('customKey').value = '';
            }
        }

        // Logout Working Function
        function adminLogout() {
            if(confirm("Are you sure you want to logout?")) {
                window.location.href = "index.html"; // Redirect to login/user page
            }
        }
    </script>
</body>
</html>
