<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DarkGPT - Premium Admin Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background-color: #08070a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background: radial-gradient(circle at top, #2d0b13 0%, #08070a 70%);
        }
        .admin-card {
            background: #0f0e13;
            border: 1px solid #251217;
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 40px rgba(255, 42, 75, 0.15);
            position: relative;
        }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h2 { color: #ff2a4b; font-size: 1.5rem; font-weight: 800; letter-spacing: -0.5px; }
        .settings-btn { background: #1a1822; border: 1px solid #2a2738; color: #fff; width: 38px; height: 38px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
        
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.8rem; color: #aaa; margin-bottom: 6px; text-transform: uppercase; font-weight: 600; }
        input, select {
            width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #22202c;
            background-color: #121118; color: white; outline: none; font-size: 0.9rem;
        }
        input:focus, select:focus { border-color: #ff2a4b; }
        
        .btn-primary {
            width: 100%; padding: 14px; background: linear-gradient(90deg, #ff2a4b, #e0002b);
            color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 42, 75, 0.3); margin-top: 5px;
        }
        .btn-secondary { background: #1a1822; border: 1px solid #2a2738; color: white; padding: 10px; border-radius: 10px; cursor: pointer; width: 100%; font-weight: 600; margin-top: 8px; }

        .key-list { margin-top: 20px; max-height: 200px; overflow-y: auto; }
        .key-item {
            background: #121118; border: 1px solid #251217; border-left: 3px solid #ff2a4b;
            padding: 10px; border-radius: 8px; margin-bottom: 8px; font-size: 0.8rem;
            display: flex; justify-content: space-between; align-items: center;
        }
        .delete-btn { color: #ff2a4b; background: none; border: none; cursor: pointer; font-weight: bold; }

        /* Modal */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
        .modal.active { display: flex; }
        .modal-content { background: #0f0e13; border: 1px solid #251217; border-radius: 20px; padding: 25px; width: 90%; max-width: 400px; }
    </style>
</head>
<body>

    <!-- Admin Login -->
    <div class="admin-card" id="loginBox">
        <h2>Admin Login</h2>
        <div style="font-size:0.8rem; color:#888; margin-bottom:20px;">Access DarkGPT Key Dashboard</div>
        <div class="input-group">
            <label>Username</label>
            <input type="text" id="adminUser" placeholder="Enter username">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="adminPass" placeholder="Enter password">
        </div>
        <button class="btn-primary" onclick="loginAdmin()">Login to Dashboard</button>
        <p id="loginErr" style="color:#ff2a4b; font-size:0.8rem; text-align:center; margin-top:10px;"></p>
    </div>

    <!-- Main Dashboard -->
    <div class="admin-card" id="dashboardBox" style="display:none;">
        <div class="header-bar">
            <h2>Key Manager</h2>
            <button class="settings-btn" onclick="openSettings()">⚙️</button>
        </div>

        <div class="input-group">
            <label>Select Plan</label>
            <select id="planType">
                <option value="starter">Starter Plan (Monthly)</option>
                <option value="unlimited">Unlimited Plan (Monthly)</option>
                <option value="lifetime">Lifetime Access</option>
            </select>
        </div>

        <button class="btn-primary" onclick="generateKey()">Auto Generate Key</button>
        
        <div style="text-align:center; margin:15px 0; color:#555; font-size:0.8rem;">— OR ADD CUSTOM KEY —</div>

        <div class="input-group">
            <input type="text" id="customKeyInput" placeholder="Enter custom key (e.g. MYKEY123)">
        </div>
        <button class="btn-secondary" onclick="addCustomKey()">Add Custom Key</button>

        <div class="key-list" id="keyList"></div>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="header-bar">
                <h2 style="font-size:1.2rem;">Admin Credentials</h2>
                <button class="settings-btn" style="width:30px; height:30px;" onclick="closeSettings()">✕</button>
            </div>
            <div class="input-group">
                <label>New Admin Username</label>
                <input type="text" id="newAdminUser" placeholder="New username">
            </div>
            <div class="input-group">
                <label>New Admin Password</label>
                <input type="password" id="newAdminPass" placeholder="New password">
            </div>
            <button class="btn-primary" onclick="saveSettings()">Save Changes</button>
        </div>
    </div>

    <script>
        // Default Credentials
        let savedUser = localStorage.getItem('flaxxi_admin_user') || 'tenzino';
        let savedPass = localStorage.getItem('flaxxi_admin_pass') || '123456';

        function loginAdmin() {
            const user = document.getElementById('adminUser').value.trim();
            const pass = document.getElementById('adminPass').value.trim();

            if (user === savedUser && pass === savedPass) {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('dashboardBox').style.display = 'block';
                loadKeys();
            } else {
                document.getElementById('loginErr').innerText = "Invalid Admin Credentials!";
            }
        }

        function generateKey() {
            const plan = document.getElementById('planType').value;
            const code = Math.random().toString(36).substring(2, 9).toUpperCase();
            const fullKey = `DARK-${plan.toUpperCase()}-${code}`;
            saveKeyToStorage(fullKey, plan);
        }

        function addCustomKey() {
            const key = document.getElementById('customKeyInput').value.trim();
            const plan = document.getElementById('planType').value;
            if (!key) return alert("Enter key string!");
            saveKeyToStorage(key, plan);
            document.getElementById('customKeyInput').value = '';
        }

        function saveKeyToStorage(key, plan) {
            let keys = JSON.parse(localStorage.getItem('flaxxi_valid_keys') || "{}");
            keys[key] = plan;
            localStorage.setItem('flaxxi_valid_keys', JSON.stringify(keys));
            loadKeys();
        }

        function deleteKey(key) {
            let keys = JSON.parse(localStorage.getItem('flaxxi_valid_keys') || "{}");
            delete keys[key];
            localStorage.setItem('flaxxi_valid_keys', JSON.stringify(keys));
            loadKeys();
        }

        function loadKeys() {
            let keys = JSON.parse(localStorage.getItem('flaxxi_valid_keys') || "{}");
            const keyList = document.getElementById('keyList');
            keyList.innerHTML = '';

            Object.keys(keys).forEach(key => {
                const item = document.createElement('div');
                item.className = 'key-item';
                item.innerHTML = `
                    <div>
                        <strong style="color:#fff;">${key}</strong><br>
                        <span style="color:#888;">Plan: ${keys[key].toUpperCase()}</span>
                    </div>
                    <button class="delete-btn" onclick="deleteKey('${key}')">✕</button>
                `;
                keyList.appendChild(item);
            });
        }

        function openSettings() {
            document.getElementById('newAdminUser').value = savedUser;
            document.getElementById('newAdminPass').value = savedPass;
            document.getElementById('settingsModal').classList.add('active');
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.remove('active');
        }

        function saveSettings() {
            const newUser = document.getElementById('newAdminUser').value.trim();
            const newPass = document.getElementById('newAdminPass').value.trim();

            if (newUser && newPass) {
                savedUser = newUser;
                savedPass = newPass;
                localStorage.setItem('flaxxi_admin_user', newUser);
                localStorage.setItem('flaxxi_admin_pass', newPass);
                alert("Admin Credentials Updated!");
                closeSettings();
            } else {
                alert("Please fill both fields!");
            }
        }
    </script>
</body>
</html>
