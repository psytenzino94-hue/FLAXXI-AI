<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLAXXI AI - Admin Panel</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }
        .card {
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 25px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.2);
        }
        h2 { color: #ff2a2a; text-align: center; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #ccc; }
        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #444;
            background-color: #000;
            color: white;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #e60000;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .key-display {
            margin-top: 15px;
            padding: 10px;
            background: #222;
            border-left: 4px solid #ff2a2a;
            word-break: break-all;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <!-- Login Box -->
    <div class="card" id="loginBox">
        <h2>Admin Login</h2>
        <div class="input-group">
            <label>Username</label>
            <input type="text" id="adminUser" placeholder="Enter username">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="adminPass" placeholder="Enter password">
        </div>
        <button onclick="loginAdmin()">Login</button>
        <p id="loginErr" style="color:red; font-size:0.85rem; text-align:center;"></p>
    </div>

    <!-- Key Generator Dashboard -->
    <div class="card" id="dashboardBox" style="display:none;">
        <h2>Key Generator</h2>
        <div class="input-group">
            <label>Select Plan Validity</label>
            <select id="planType">
                <option value="1month">1 Month (30 Days)</option>
                <option value="1year">1 Year (365 Days)</option>
                <option value="lifetime">Lifetime Plan</option>
            </select>
        </div>
        <button onclick="generateKey()">Generate Plan Key</button>

        <div id="generatedKey" class="key-display" style="display:none;"></div>
    </div>

    <script>
        function loginAdmin() {
            const user = document.getElementById('adminUser').value.trim();
            const pass = document.getElementById('adminPass').value.trim();

            if (user === "tenzino" && pass === "123456") {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('dashboardBox').style.display = 'block';
            } else {
                document.getElementById('loginErr').innerText = "Invalid Admin Credentials!";
            }
        }

        function generateKey() {
            const plan = document.getElementById('planType').value;
            const randomCode = Math.random().toString(36).substring(2, 10).toUpperCase();
            const fullKey = `FLAXXI-${plan.toUpperCase()}-${randomCode}`;

            // Save key in local storage array
            let keys = JSON.parse(localStorage.getItem('flaxxi_valid_keys') || "{}");
            keys[fullKey] = plan;
            localStorage.setItem('flaxxi_valid_keys', JSON.stringify(keys));

            const keyBox = document.getElementById('generatedKey');
            keyBox.style.display = 'block';
            keyBox.innerHTML = `<strong>Generated Key:</strong><br>${fullKey}`;
        }
    </script>
</body>
</html>
