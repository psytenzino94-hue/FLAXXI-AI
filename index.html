<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLAXXI GPT - AI Without Limits</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0a0407;
            --card-bg: #140b10;
            --accent-red: #ff2a55;
            --accent-glow: rgba(255, 42, 85, 0.4);
            --text-main: #ffffff;
            --text-sub: #a399a2;
            --border-color: #2b1723;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; overflow-x: hidden; }

        header {
            display: flex; justify-content: space-between; align-items: center; padding: 16px 20px;
            background: rgba(10, 4, 7, 0.95); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100;
        }

        .logo { font-size: 20px; font-weight: 900; color: var(--text-main); }
        .logo span { color: var(--accent-red); }

        .btn-red { background: var(--accent-red); color: white; border: none; padding: 8px 16px; border-radius: 10px; font-weight: 700; cursor: pointer; }
        .btn-sec { background: var(--card-bg); color: white; border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 10px; cursor: pointer; }

        .hero { text-align: center; padding: 30px 15px; }
        .hero h1 { font-size: 36px; font-weight: 900; }
        .hero h2 { color: var(--accent-red); font-size: 20px; margin-bottom: 10px; }

        .chat-wrapper { max-width: 650px; margin: 20px auto; padding: 0 15px; }
        .chat-box { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 18px; padding: 15px; min-height: 250px; max-height: 380px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }

        .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; }
        .msg-user { background: var(--accent-red); color: white; align-self: flex-end; }
        .msg-ai { background: #1a0e16; color: white; border: 1px solid var(--border-color); align-self: flex-start; }
        .voice-btn { color: var(--accent-red); margin-left: 8px; cursor: pointer; }

        .input-bar { display: flex; align-items: center; background: #0c060a; border: 1px solid var(--border-color); border-radius: 14px; padding: 8px 12px; gap: 8px; margin-top: 12px; }
        .input-bar input { flex: 1; background: transparent; border: none; outline: none; color: white; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 200; }
        .modal-content { background: var(--card-bg); border: 1px solid var(--border-color); width: 90%; max-width: 380px; padding: 20px; border-radius: 16px; position: relative; }
        .close-btn { position: absolute; top: 12px; right: 15px; color: var(--text-sub); cursor: pointer; font-size: 18px; }
        .modal input { width: 100%; padding: 10px; background: #080306; border: 1px solid var(--border-color); color: white; border-radius: 8px; margin: 8px 0; outline: none; }
    </style>
</head>
<body>

    <header>
        <div class="logo">FLAXXI <span>GPT</span></div>
        <div>
            <button class="btn-sec" onclick="openModal('authModal')">Account</button>
            <button class="btn-red" onclick="openModal('keyModal')">Enter Key</button>
        </div>
    </header>

    <div class="hero">
        <h1>DarkGPT</h1>
        <h2>AI Without Limits</h2>
        <div style="display:flex; gap:10px; justify-content:center; margin-top:15px;">
            <button class="btn-red" onclick="openModal('keyModal')">Open DarkGPT</button>
            <a href="https://wa.me/9819833267" target="_blank" class="btn-sec" style="text-decoration:none;"><i class="fa-brands fa-whatsapp"></i> Buy Key</a>
        </div>
    </div>

    <!-- Chat Box -->
    <div class="chat-wrapper">
        <div class="chat-box" id="chatBox">
            <div class="msg msg-ai">Hello! Welcome to FLAXXI GPT. Ask me any question! <i class="fa-solid fa-volume-high voice-btn" onclick="speakText(this)"></i></div>
        </div>

        <div class="input-bar">
            <i class="fa-solid fa-paperclip" style="color:var(--text-sub); cursor:pointer;"></i>
            <input type="text" id="userInput" placeholder="Ask your question..." onkeypress="if(event.key==='Enter') sendAIQuery()">
            <button class="btn-red" style="padding:6px 12px;" onclick="sendAIQuery()"><i class="fa-solid fa-arrow-up"></i></button>
        </div>
    </div>

    <!-- Create Account / Login Modal -->
    <div class="modal" id="authModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('authModal')">&times;</span>
            <h3 style="margin-bottom:10px;">Create Account / Login</h3>
            <input type="text" id="userIdentity" placeholder="Email or Phone Number">
            <button class="btn-sec" style="width:100%; margin-bottom:8px;" onclick="sendOTP()">Send OTP</button>

            <div id="otpSection" style="display:none;">
                <input type="text" id="otpInput" placeholder="Enter 4-digit OTP">
                <button class="btn-red" style="width:100%;" onclick="verifyOTP()">Verify & Login</button>
            </div>
        </div>
    </div>

    <!-- Key Validation Modal -->
    <div class="modal" id="keyModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('keyModal')">&times;</span>
            <h3>Enter Access Key</h3>
            <input type="text" id="accessKeyInput" placeholder="Enter License Key">
            <p id="keyError" style="color:red; font-size:12px; display:none; margin-bottom:8px;">Invalid Key! Please purchase a valid key.</p>
            <button class="btn-red" style="width:100%;" onclick="validateKey()">Activate Key</button>
        </div>
    </div>

    <script>
        let generatedOTP = null;

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // Send OTP Simulation
        function sendOTP() {
            const idVal = document.getElementById('userIdentity').value.trim();
            if(!idVal) { alert("Please enter Email or Phone Number!"); return; }
            generatedOTP = Math.floor(1000 + Math.random() * 9000);
            alert(`OTP sent to ${idVal}: ${generatedOTP}`);
            document.getElementById('otpSection').style.display = 'block';
        }

        function verifyOTP() {
            const enteredOTP = document.getElementById('otpInput').value.trim();
            if(enteredOTP == generatedOTP) {
                alert("Account Created & Logged in successfully!");
                closeModal('authModal');
            } else {
                alert("Invalid OTP!");
            }
        }

        function validateKey() {
            const key = document.getElementById('accessKeyInput').value.trim();
            const validKeys = ["FLAXXI-123", "UNLIMITED-2026", "LIFETIME-VIP"];
            if(validKeys.includes(key)) {
                alert("Access Key Activated!");
                closeModal('keyModal');
            } else {
                document.getElementById('keyError').style.display = 'block';
            }
        }

        // Live API Integration for Correct Answers
        async function sendAIQuery() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML += `<div class="msg msg-user">${text}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            const loadingId = 'ai_' + Date.now();
            chatBox.innerHTML += `<div class="msg msg-ai" id="${loadingId}">Thinking...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // Connecting to Live Pollinations AI Engine
                const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(text)}`);
                const answer = await response.text();

                document.getElementById(loadingId).innerHTML = `${answer} <i class="fa-solid fa-volume-high voice-btn" onclick="speakText(this)"></i>`;
            } catch(e) {
                document.getElementById(loadingId).innerText = "Error getting response. Please try again.";
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function speakText(icon) {
            const text = icon.parentElement.innerText.replace('Thinking...', '').trim();
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
