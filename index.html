<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLAXXI GPT - AI Without Limits</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0a0407;
            --card-bg: #140b10;
            --accent-red: #ff2a55;
            --accent-glow: rgba(255, 42, 85, 0.35);
            --text-main: #ffffff;
            --text-sub: #a399a2;
            --border-color: #2b1723;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            background-image: radial-gradient(circle at 50% 20%, rgba(255, 42, 85, 0.15) 0%, transparent 60%);
            background-attachment: fixed;
            overflow-x: hidden;
        }

        /* Top Header Navigation */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: rgba(10, 4, 7, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            font-size: 22px;
            font-weight: 900;
            color: var(--text-main);
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .logo span { color: var(--accent-red); }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Profile & Account Badges */
        .badge-pro {
            background: var(--accent-red);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .avatar-account {
            width: 32px;
            height: 32px;
            background: var(--accent-red);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 0 12px var(--accent-glow);
            transition: transform 0.2s;
        }
        .avatar-account:hover { transform: scale(1.08); }

        .menu-toggle {
            font-size: 20px;
            cursor: pointer;
            color: var(--text-main);
        }

        /* Drawer Overlay */
        .drawer-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 200;
            backdrop-filter: blur(5px);
        }

        .drawer {
            position: fixed;
            top: 0; left: -280px; width: 280px; height: 100%;
            background: var(--card-bg);
            border-right: 1px solid var(--border-color);
            z-index: 300;
            transition: left 0.3s ease;
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
        }

        .drawer.open { left: 0; }

        .close-drawer {
            align-self: flex-end;
            font-size: 20px;
            cursor: pointer;
            margin-bottom: 30px;
            color: var(--text-sub);
        }

        .drawer-links {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .drawer-links a {
            color: var(--text-main);
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
        }

        /* Chat Page UI */
        .chat-container {
            max-width: 500px;
            margin: 0 auto;
            height: calc(100vh - 80px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 15px;
        }

        .chat-hero {
            text-align: center;
            margin-top: auto;
            margin-bottom: auto;
        }

        .chat-hero h1 {
            font-size: 38px;
            font-weight: 900;
            letter-spacing: -1px;
        }

        .chat-hero h1 span { color: var(--accent-red); }

        .chat-hero h2 {
            font-size: 18px;
            color: white;
            margin-top: 6px;
            font-weight: 700;
        }

        .chat-hero .sub-tags {
            font-size: 11px;
            color: var(--accent-red);
            font-weight: 800;
            letter-spacing: 1.5px;
            margin-top: 12px;
            text-transform: uppercase;
        }

        /* Exact Red-Glow Chat Input Container */
        .chat-input-card {
            background: #120a0f;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            position: relative;
        }

        .chat-controls-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .chat-controls-left {
            display: flex;
            gap: 16px;
            color: var(--text-sub);
            font-size: 16px;
        }

        .chat-controls-left i { cursor: pointer; transition: color 0.2s; }
        .chat-controls-left i:hover { color: white; }

        .model-select {
            background: #1a0e16;
            border: 1px solid var(--border-color);
            color: white;
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 12px;
            outline: none;
            cursor: pointer;
            font-weight: 600;
        }

        .chat-textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            font-size: 15px;
            outline: none;
            resize: none;
            height: 45px;
            margin-top: 5px;
        }

        .btn-send-round {
            background: var(--accent-red);
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            box-shadow: 0 0 12px var(--accent-glow);
            float: right;
        }

        /* Account / Profile Modal Drawer ("A" Account Click) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            width: 90%;
            max-width: 400px;
            padding: 25px;
            border-radius: 24px;
            position: relative;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
        }

        .close-btn {
            position: absolute;
            top: 18px; right: 18px;
            color: var(--text-sub);
            cursor: pointer;
            font-size: 20px;
        }

        .account-header-box {
            display: flex;
            align-items: center;
            gap: 15px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .account-avatar-large {
            width: 50px;
            height: 50px;
            background: var(--accent-red);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 900;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .account-info h3 { font-size: 16px; font-weight: 800; }
        .account-info p { font-size: 12px; color: var(--text-sub); }

        .account-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px dashed var(--border-color);
            font-size: 13px;
        }

        .btn-red-full {
            background: var(--accent-red);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            box-shadow: 0 4px 15px var(--accent-glow);
            text-align: center;
            text-decoration: none;
            display: block;
        }

        .btn-outline-admin {
            background: transparent;
            border: 1px solid var(--accent-red);
            color: var(--accent-red);
            padding: 10px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <div class="header-left">
            <div class="menu-toggle" onclick="toggleDrawer()"><i class="fa-solid fa-bars"></i></div>
            <div class="logo">
                <i class="fa-solid fa-fire" style="color: var(--accent-red);"></i> FLAXXI <span>GPT</span>
            </div>
        </div>
        <div class="header-right">
            <div class="badge-pro">Pro</div>
            <!-- Account Profile Button "A" -->
            <div class="avatar-account" onclick="openModal('accountModal')" title="User Account">A</div>
        </div>
    </header>

    <!-- Side Navigation Drawer -->
    <div class="drawer-overlay" id="overlay" onclick="toggleDrawer()"></div>
    <div class="drawer" id="drawer">
        <div class="close-drawer" onclick="toggleDrawer()"><i class="fa-solid fa-xmark"></i></div>
        <div class="drawer-links">
            <a href="#"><i class="fa-solid fa-plus"></i> New Chat</a>
            <a href="#" onclick="openModal('accountModal')"><i class="fa-solid fa-user"></i> My Account</a>
            <a href="admin.html" style="color: var(--accent-red);"><i class="fa-solid fa-user-shield"></i> Admin Panel</a>
        </div>
    </div>

    <!-- Main Chat Interface -->
    <div class="chat-container">
        <div class="chat-hero">
            <h1>Dark<span>GPT</span></h1>
            <h2>AI without limits.</h2>
            <div class="sub-tags">CODE · RESEARCH · ANALYSIS · CREATION</div>
        </div>

        <!-- Chat Input Field Card -->
        <div class="chat-input-card">
            <div class="chat-controls-top">
                <div class="chat-controls-left">
                    <i class="fa-solid fa-paperclip" title="Attach Document/Image"></i>
                    <i class="fa-solid fa-microphone" title="Voice Input"></i>
                </div>
                <select class="model-select">
                    <option>No Limit v</option>
                    <option>OSINT Mode</option>
                    <option>Code Master</option>
                </select>
            </div>
            
            <textarea class="chat-textarea" placeholder="What can I do for you?"></textarea>
            
            <button class="btn-send-round"><i class="fa-solid fa-arrow-up"></i></button>
        </div>
    </div>

    <!-- Account Details Modal (Opens when clicking "A") -->
    <div class="modal" id="accountModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('accountModal')">&times;</span>
            
            <div class="account-header-box">
                <div class="account-avatar-large">A</div>
                <div class="account-info">
                    <h3>Account Profile</h3>
                    <p>user@flaxxi-gpt.ai</p>
                </div>
            </div>

            <div class="account-item-row">
                <span style="color: var(--text-sub);">Subscription Plan</span>
                <span style="color: var(--accent-red); font-weight: 800;">PRO / UNLIMITED</span>
            </div>

            <div class="account-item-row">
                <span style="color: var(--text-sub);">Access Key</span>
                <span style="font-family: monospace; font-size: 11px;">FLAXXI-8921-X</span>
            </div>

            <div class="account-item-row">
                <span style="color: var(--text-sub);">AI Model Status</span>
                <span style="color: #25d366; font-weight: 700;">Uncensored Enabled</span>
            </div>

            <!-- Link to open Admin Control Panel directly -->
            <button class="btn-outline-admin" onclick="window.location.href='admin.html'">
                <i class="fa-solid fa-lock"></i> Go to Admin Portal
            </button>

            <button class="btn-red-full" onclick="closeModal('accountModal')">Done</button>
        </div>
    </div>

    <script>
        function toggleDrawer() {
            const drawer = document.getElementById('drawer');
            const overlay = document.getElementById('overlay');
            drawer.classList.toggle('open');
            overlay.style.display = drawer.classList.contains('open') ? 'block' : 'none';
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    </script>
</body>
</html>
