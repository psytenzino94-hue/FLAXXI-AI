<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLAXXI AI - Chat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0a0407;
            --card-bg: #140b10;
            --accent-red: #ff2a55;
            --accent-glow: rgba(255, 42, 85, 0.35);
            --text-main: #ffffff;
            --text-sub: #a399a2;
            --border-color: #2b1723;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: radial-gradient(circle at 50% 20%, rgba(255, 42, 85, 0.12) 0%, transparent 60%);
        }

        /* Top Header Navigation */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            background: rgba(20, 11, 16, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 18px; }
        .brand i { color: var(--accent-red); font-size: 20px; }
        .brand span { color: var(--accent-red); }

        .nav-actions { display: flex; align-items: center; gap: 10px; }
        .btn-badge {
            background: var(--accent-red);
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            border: none;
            cursor: pointer;
        }
        .user-avatar {
            background: var(--accent-red);
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
        }

        /* Main Chat Area */
        .chat-container {
            flex: 1;
            max-width: 650px;
            width: 100%;
            margin: 0 auto;
            padding: 20px 15px 120px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }

        .msg-bubble {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
        }
        .msg-user {
            align-self: flex-end;
            background: var(--accent-red);
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .msg-ai {
            align-self: flex-start;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
        }
        .msg-error {
            align-self: flex-start;
            background: rgba(255, 42, 85, 0.15);
            border: 1px solid var(--accent-red);
            color: #ff6b8b;
        }

        /* Input Bar Area */
        .input-bar-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10, 4, 7, 0.95);
            backdrop-filter: blur(10px);
            padding: 12px 15px 20px;
            border-top: 1px solid var(--border-color);
        }

        .input-status-tag {
            text-align: center;
            font-size: 11px;
            color: var(--text-sub);
            margin-bottom: 8px;
        }

        .input-box-wrapper {
            max-width: 650px;
            margin: 0 auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 25px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 14px;
            outline: none;
            padding: 8px 5px;
        }

        .btn-send {
            background: var(--accent-red);
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 10px var(--accent-glow);
            transition: transform 0.1s;
        }
        .btn-send:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <div class="navbar">
        <div class="brand">
            <i class="fa-solid fa-fire-flame-curved"></i>
            FLAXXI <span>AI</span>
        </div>
        <div class="nav-actions">
            <button class="btn-badge">Plan</button>
            <div class="user-avatar">A</div>
        </div>
    </div>

    <!-- Chat Bubbles Area -->
    <div class="chat-container" id="chatContainer">
        <!-- Messages load dynamically -->
    </div>

    <!-- Bottom Input Area -->
    <div class="input-bar-container">
        <div class="input-status-tag">Unlimited Access ⚡</div>
        <div class="input-box-wrapper">
            <input type="text" id="userInput" class="chat-input" placeholder="What can I do for you?" onkeypress="handleKeyPress(event)">
            <button class="btn-send" onclick="sendMessage()"><i class="fa-solid fa-arrow-up"></i></button>
        </div>
    </div>

    <script>
        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const message = inputField.value.trim();
            if (!message) return;

            // 1. Check if App is Banned / Disabled from Admin
            const isAppActive = localStorage.getItem('flaxxi_app_active') !== 'false';
            if (!isAppActive) {
                const banMsg = localStorage.getItem('flaxxi_ban_message') || 'App is currently under maintenance.';
                appendMessage(banMsg, 'msg-error');
                return;
            }

            // 2. Check Website Paid/Free Access Mode
            const accessMode = localStorage.getItem('flaxxi_access_mode') || 'FREE';
            if (accessMode === 'PAID') {
                const isPaidUser = localStorage.getItem('flaxxi_user_paid') === 'true';
                if (!isPaidUser) {
                    const noticeMsg = localStorage.getItem('flaxxi_paid_notice') || 'Paid Mode is Enabled! Please buy a subscription key to use the app.';
                    appendMessage(noticeMsg, 'msg-error');
                    return;
                }
            }

            // Display User Message
            appendMessage(message, 'msg-user');
            inputField.value = '';

            // 3. Get API Key from LocalStorage
            const apiKey = localStorage.getItem('flaxxi_gemini_key');
            if (!apiKey) {
                appendMessage("Error: API Key is missing in Local Storage. Please set 'flaxxi_gemini_key' from Admin Panel.", 'msg-error');
                return;
            }

            // Show Loading Bubble
            appendMessage("Thinking...", 'msg-ai', 'temp-loading');

            try {
                // Fixed Gemini API Endpoint
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: message }] }]
                    })
                });

                const data = await response.json();
                removeLoadingBubble();

                if (response.ok && data.candidates && data.candidates[0].content) {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    appendMessage(aiReply, 'msg-ai');
                } else {
                    const errDetail = data.error ? data.error.message : "Unknown API Error";
                    appendMessage(`API Error: ${errDetail}`, 'msg-error');
                }
            } catch (err) {
                removeLoadingBubble();
                appendMessage(`Connection Error: ${err.message}`, 'msg-error');
            }
        }

        function appendMessage(text, className, id = '') {
            const container = document.getElementById('chatContainer');
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg-bubble ${className}`;
            if (id) msgDiv.id = id;
            msgDiv.innerText = text;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        function removeLoadingBubble() {
            const temp = document.getElementById('temp-loading');
            if (temp) temp.remove();
        }
    </script>
</body>
</html>
