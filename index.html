<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLAXXI AI</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #1a1a1a;
            border-bottom: 1px solid #333;
        }
        .logo { color: #ff2a2a; font-weight: bold; font-size: 1.2rem; }
        .header-btns { display: flex; gap: 10px; align-items: center; }
        .redeem-btn {
            background-color: #e60000;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }
        .plan-badge {
            background-color: #333;
            color: #ff2a2a;
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 10px;
            border: 1px solid #ff2a2a;
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message-container { display: flex; flex-direction: column; max-width: 80%; }
        .user-container { align-self: flex-end; }
        .ai-container { align-self: flex-start; }
        .message-bubble {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .user-container .message-bubble { background-color: #5a0000; color: #ffffff; }
        .ai-container .message-bubble { background-color: #1f1f1f; color: #ffffff; }
        .timestamp { font-size: 0.75rem; color: #888; margin-bottom: 4px; }
        .input-container {
            padding: 15px;
            background-color: #141414;
            display: flex;
            align-items: center;
            gap: 10px;
            border-top: 1px solid #222;
        }
        .input-box {
            flex: 1;
            background-color: #222;
            border: none;
            padding: 12px 15px;
            border-radius: 25px;
            color: white;
            outline: none;
        }
        .send-btn {
            background-color: #e60000;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">FLAXXI AI</div>
        <div class="header-btns">
            <span class="plan-badge" id="userPlan">Plan: Free</span>
            <button class="redeem-btn" onclick="promptRedeem()">Redeem Key</button>
        </div>
    </header>

    <div class="chat-container" id="chatBox"></div>

    <div class="input-container">
        <input type="text" id="userInput" class="input-box" placeholder="Ask in any language..." onkeypress="handleKeyPress(event)">
        <button class="send-btn" onclick="sendMessage()">➔</button>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        let freeMsgCount = parseInt(localStorage.getItem('flaxxi_msg_count') || '0');
        let activePlan = localStorage.getItem('flaxxi_active_plan') || 'free';

        document.getElementById('userPlan').innerText = `Plan: ${activePlan.toUpperCase()}`;

        function promptRedeem() {
            const key = prompt("Enter your License Key:");
            if (!key) return;

            let keys = JSON.parse(localStorage.getItem('flaxxi_valid_keys') || "{}");
            if (keys[key]) {
                const planName = keys[key];
                localStorage.setItem('flaxxi_active_plan', planName);
                delete keys[key]; // Consume key
                localStorage.setItem('flaxxi_valid_keys', JSON.stringify(keys));
                alert(`Success! ${planName.toUpperCase()} Plan Activated!`);
                location.reload();
            } else {
                alert("Invalid Key!");
            }
        }

        function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }

        function sendMessage() {
            if (activePlan === 'free' && freeMsgCount >= 5) {
                alert("Free limit reached (5 messages)! Please Redeem a Key for 1 Month, 1 Year, or Lifetime access.");
                return;
            }

            const text = userInput.value.trim();
            if (text === "") return;

            if (activePlan === 'free') {
                freeMsgCount++;
                localStorage.setItem('flaxxi_msg_count', freeMsgCount.toString());
            }

            const userContainer = document.createElement('div');
            userContainer.className = 'message-container user-container';
            userContainer.innerHTML = `<div class="timestamp">Just now</div><div class="message-bubble">${text}</div>`;
            chatBox.appendChild(userContainer);

            userInput.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            setTimeout(() => {
                const aiContainer = document.createElement('div');
                aiContainer.className = 'message-container ai-container';
                aiContainer.innerHTML = `<div class="timestamp">Just now</div><div class="message-bubble">Main FLAXXI AI hoon. Aapka message mil gaya!</div>`;
                chatBox.appendChild(aiContainer);
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 600);
        }
    </script>
</body>
</html>
