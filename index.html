<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLAXXI AI</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #1a1a1a;
            border-bottom: 1px solid #333;
        }
        .logo {
            color: #ff2a2a;
            font-weight: bold;
            font-size: 1.2rem;
        }
        .header-btns {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .redeem-btn {
            background-color: #e60000;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }
        .avatar {
            background-color: #e60000;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message-container {
            display: flex;
            flex-direction: column;
            max-width: 80%;
        }
        .user-container {
            align-self: flex-end;
        }
        .ai-container {
            align-self: flex-start;
        }
        .message-bubble {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .user-container .message-bubble {
            background-color: #5a0000;
            color: #ffffff;
            border-bottom-right-radius: 2px;
        }
        .ai-container .message-bubble {
            background-color: #1f1f1f;
            color: #ffffff;
            border-bottom-left-radius: 2px;
        }
        .timestamp {
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 4px;
        }
        .input-container {
            padding: 15px;
            background-color: #141414;
            display: flex;
            align-items: center;
            gap: 10px;
            border-top: 1px solid #222;
        }
        .input-box {
            flex: 1;
            background-color: #222;
            border: none;
            padding: 12px 15px;
            border-radius: 25px;
            color: white;
            outline: none;
        }
        .send-btn {
            background-color: #e60000;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">FLAXXI AI</div>
        <div class="header-btns">
            <button class="redeem-btn">Redeem Key</button>
            <div class="avatar">A</div>
        </div>
    </header>

    <div class="chat-container" id="chatBox"></div>

    <div class="input-container">
        <input type="text" id="userInput" class="input-box" placeholder="Ask in any language..." onkeypress="handleKeyPress(event)">
        <button class="send-btn" onclick="sendMessage()">➔</button>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;")
                      .replace(/</g, "&lt;")
                      .replace(/>/g, "&gt;")
                      .replace(/"/g, "&quot;")
                      .replace(/'/g, "&#039;");
        }

        function generateMultilingualResponse(query) {
            const lower = query.toLowerCase();
            if (lower.includes('kaise') || lower.includes('kya') || lower.includes('namaste') || lower.includes('batao')) {
                return `Main FLAXXI AI hoon. Aapke sawal "${escapeHtml(query)}" ka jawab dene ke liye taiyar hoon.`;
            } else {
                return `I am FLAXXI AI. Here is the response for: "${escapeHtml(query)}".`;
            }
        }

        function sendMessage() {
            const text = userInput.value.trim();
            if (text === "") return;

            // Add User Message
            const userContainer = document.createElement('div');
            userContainer.className = 'message-container user-container';
            userContainer.innerHTML = `
                <div class="timestamp">Just now</div>
                <div class="message-bubble">${escapeHtml(text)}</div>
            `;
            chatBox.appendChild(userContainer);

            userInput.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // FLAXXI AI Response
            setTimeout(() => {
                const aiContainer = document.createElement('div');
                aiContainer.className = 'message-container ai-container';
                const replyText = generateMultilingualResponse(text);

                aiContainer.innerHTML = `
                    <div class="timestamp">Just now</div>
                    <div class="message-bubble">${replyText}</div>
                `;
                chatBox.appendChild(aiContainer);
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 600);
        }
    </script>
</body>
</html>
