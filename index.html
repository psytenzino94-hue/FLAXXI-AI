<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLAXXI AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #08070a; color: #ffffff; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 280px; background: #0c0b0e; border-right: 1px solid #1a1822; display: flex; flex-direction: column; padding: 15px; position: absolute; height: 100%; z-index: 10; transition: 0.3s; }
        .brand { font-size: 1.4rem; font-weight: 800; color: #ff2a4b; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .new-chat-btn { background: #ff2a4b; color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-bottom: 15px; }
        
        .history-title { font-size: 0.75rem; color: #666; font-weight: bold; margin-bottom: 10px; }
        .history-list { flex: 1; overflow-y: auto; }
        .history-item { display: flex; justify-content: space-between; align-items: center; background: #121118; padding: 10px; border-radius: 8px; margin-bottom: 8px; font-size: 0.85rem; cursor: pointer; border: 1px solid transparent; }
        .history-item:hover { border-color: #ff2a4b; }
        .delete-chat { color: #ff2a4b; background: none; border: none; cursor: pointer; font-size: 0.9rem; padding: 0 5px; }

        .user-profile { background: #121118; padding: 12px; border-radius: 10px; display: flex; align-items: center; gap: 10px; margin-top: auto; cursor: pointer; border: 1px solid #222; }
        .avatar { width: 35px; height: 35px; background: #ff2a4b; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }

        /* Main Chat Area */
        .main-chat { flex: 1; display: flex; flex-direction: column; height: 100vh; margin-left: 280px; width: calc(100% - 280px); }
        .chat-header { padding: 15px; border-bottom: 1px solid #1a1822; font-weight: bold; font-size: 1.1rem; color: #ff2a4b; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        
        .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 0.95rem; line-height: 1.4; position: relative; }
        .message.user { background: #251217; color: #fff; align-self: flex-end; border: 1px solid #ff2a4b33; }
        .message.ai { background: #121118; color: #ddd; align-self: flex-start; border: 1px solid #222; }
        .play-btn { background: #1a1822; border: 1px solid #ff2a4b; color: #ff2a4b; border-radius: 50%; width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; margin-left: 8px; font-size: 0.7rem; }

        .chat-input-area { padding: 15px; border-top: 1px solid #1a1822; display: flex; gap: 10px; background: #08070a; }
        .chat-input { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #222; background: #121118; color: white; outline: none; }
        .send-btn { background: #ff2a4b; border: none; color: white; padding: 0 20px; border-radius: 10px; cursor: pointer; font-weight: bold; }

        /* Modal / Login System */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .modal.active { display: flex; }
        .modal-box { background: #0f0e13; border: 1px solid #251217; border-radius: 20px; padding: 25px; width: 90%; max-width: 380px; text-align: center; }
        .login-btn-google { width: 100%; padding: 12px; background: #fff; color: #000; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin: 10px 0; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .input-group { margin-bottom: 12px; text-align: left; }
        .input-group input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #222; background: #121118; color: white; }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.active { transform: translateX(0); }
            .main-chat { margin-left: 0; width: 100%; }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="brand">
            <span>FLAXXI AI</span>
        </div>
        <button class="new-chat-btn" onclick="startNewChat()">+ New chat</button>
        <div class="history-title">HISTORY</div>
        <div class="history-list" id="historyList"></div>

        <div class="user-profile" onclick="openLoginModal()">
            <div class="avatar" id="userAvatar">U</div>
            <div>
                <div style="font-weight: bold; font-size: 0.9rem;" id="userNameDisplay">Login Account</div>
                <div style="font-size: 0.75rem; color: #888;" id="userStatus">Click to Sign In</div>
            </div>
        </div>
    </div>

    <!-- Main Chat Container -->
    <div class="main-chat">
        <div class="chat-header">FLAXXI AI</div>
        <div class="chat-messages" id="chatBox">
            <div class="message ai">
                Hello! Welcome to FLAXXI AI. How can I assist you today?
                <button class="play-btn" onclick="playSpeech('Hello! Welcome to FLAXXI AI. How can I assist you today?')">►</button>
            </div>
        </div>
        <div class="chat-input-area">
            <input type="text" class="chat-input" id="userInput" placeholder="Ask FLAXXI AI anything..." onkeypress="handleKey(event)">
            <button class="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <!-- Login Modal -->
    <div class="modal" id="loginModal">
        <div class="modal-box">
            <h3 style="color:#ff2a4b; margin-bottom: 15px;">Login to FLAXXI AI</h3>
            
            <button class="login-btn-google" onclick="loginWithGoogle()">
                <span>Continue with Google</span>
            </button>

            <div style="color:#555; margin: 10px 0; font-size:0.8rem;">OR USE OTP LOGIN</div>

            <div class="input-group">
                <input type="text" id="contactInput" placeholder="Enter Email or Phone Number">
            </div>
            
            <button class="send-btn" style="width:100%; padding:12px; margin-bottom:10px;" onclick="sendOTP()">Send OTP Code</button>

            <div class="input-group" id="otpBox" style="display:none;">
                <input type="text" id="otpInput" placeholder="Enter 4-Digit OTP">
                <button class="send-btn" style="width:100%; padding:10px; margin-top:8px;" onclick="verifyOTP()">Verify & Login</button>
            </div>

            <button style="background:none; border:none; color:#777; cursor:pointer; margin-top:10px; font-size:0.8rem;" onclick="closeLoginModal()">Cancel</button>
        </div>
    </div>

<script>
    let generatedOTPCode = null;

    // Speech System (All Languages Supported)
    function playSpeech(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            window.speechSynthesis.speak(utterance);
        }
    }

    function sendMessage() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if(!text) return;

        addMessage(text, 'user');
        input.value = '';

        // Save Chat to History
        saveHistory(text);

        // Simulated AI Response
        setTimeout(() => {
            const reply = "This is FLAXXI AI responding to: " + text;
            addMessage(reply, 'ai');
        }, 600);
    }

    function addMessage(text, type) {
        const box = document.getElementById('chatBox');
        const msg = document.createElement('div');
        msg.className = `message ${type}`;
        if(type === 'ai') {
            msg.innerHTML = `${text} <button class="play-btn" onclick="playSpeech('${text.replace(/'/g, "\\'")}')">►</button>`;
        } else {
            msg.innerText = text;
        }
        box.appendChild(msg);
        box.scrollTop = box.scrollHeight;
    }

    function handleKey(e) { if(e.key === 'Enter') sendMessage(); }

    // History Logic
    function saveHistory(text) {
        let history = JSON.parse(localStorage.getItem('flaxxi_history') || "[]");
        history.unshift({ id: Date.now(), text });
        localStorage.setItem('flaxxi_history', JSON.stringify(history));
        renderHistory();
    }

    function renderHistory() {
        let history = JSON.parse(localStorage.getItem('flaxxi_history') || "[]");
        const list = document.getElementById('historyList');
        list.innerHTML = history.map(item => `
            <div class="history-item">
                <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:180px;">💬 ${item.text}</span>
                <button class="delete-chat" onclick="deleteHistory(${item.id})">🗑️</button>
            </div>
        `).join('');
    }

    function deleteHistory(id) {
        let history = JSON.parse(localStorage.getItem('flaxxi_history') || "[]");
        history = history.filter(item => item.id !== id);
        localStorage.setItem('flaxxi_history', JSON.stringify(history));
        renderHistory();
    }

    function startNewChat() {
        document.getElementById('chatBox').innerHTML = `
            <div class="message ai">
                Hello! Welcome to FLAXXI AI. How can I assist you today?
                <button class="play-btn" onclick="playSpeech('Hello! Welcome to FLAXXI AI. How can I assist you today?')">►</button>
            </div>
        `;
    }

    // Modal & Auth Logic
    function openLoginModal() { document.getElementById('loginModal').classList.add('active'); }
    function closeLoginModal() { document.getElementById('loginModal').classList.remove('active'); }

    function loginWithGoogle() {
        saveUserToAdmin("Google User", "Google Account");
        updateUserUI("Google User");
        closeLoginModal();
    }

    function sendOTP() {
        const val = document.getElementById('contactInput').value.trim();
        if(!val) return alert("Enter Email or Phone number");
        
        generatedOTPCode = Math.floor(1000 + Math.random() * 9000);
        alert(`[FLAXXI AI] Your verification code is: ${generatedOTPCode}`);
        document.getElementById('otpBox').style.display = 'block';
    }

    function verifyOTP() {
        const entered = document.getElementById('otpInput').value.trim();
        if(entered == generatedOTPCode) {
            const contact = document.getElementById('contactInput').value.trim();
            saveUserToAdmin(contact.split('@')[0], "OTP Verified (" + contact + ")");
            updateUserUI(contact.split('@')[0]);
            closeLoginModal();
            alert("Login Successful!");
        } else {
            alert("Invalid OTP code!");
        }
    }

    function saveUserToAdmin(name, type) {
        let users = JSON.parse(localStorage.getItem('flaxxi_users') || "[]");
        users.push({ name, type, date: new Date().toLocaleDateString() });
        localStorage.setItem('flaxxi_users', JSON.stringify(users));
    }

    function updateUserUI(name) {
        document.getElementById('userNameDisplay').innerText = name;
        document.getElementById('userStatus').innerText = "Verified Account";
        document.getElementById('userAvatar').innerText = name[0].toUpperCase();
    }

    renderHistory();
</script>
</body>
</html>
